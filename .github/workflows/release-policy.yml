name: "Release policy"

# Runs the release-policy tests (tests/) on every pull request and on main, so a change to the release workflow is tested
# before it is merged. It can read the repository and nothing else: no id-token, no secret, no environment. A pull request
# that edits this file or release.yml therefore cannot publish anything; publishing needs release.yml dispatched from
# main, inside the npm-publish environment (see the header of release.yml).

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.18.0"
      - name: Run the release-policy tests
        run: node --test
